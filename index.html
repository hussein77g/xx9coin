<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>xx9coin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
html,body{background:#000;color:#fff;height:100vh;overflow:hidden;user-select:none;position:fixed;width:100%}
.scr{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;overflow:hidden;transform:translateZ(0)}
.scr.on{display:flex}
.scr.home.on{animation:fadeHome .25s ease}
@keyframes fadeHome{from{opacity:.5}to{opacity:1}}
.scr.sub.on{animation:slideIn .25s cubic-bezier(.25,.75,.4,1)}
@keyframes slideIn{from{transform:translateX(30px);opacity:.5}to{transform:translateX(0);opacity:1}}

/* TOP */
.top{padding:14px 18px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.7);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);position:relative;z-index:10;border-bottom:.5px solid rgba(255,255,255,.06);flex-shrink:0}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#FFD60A,#FF9500);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;overflow:hidden;color:#000;flex-shrink:0;box-shadow:0 2px 8px rgba(255,214,10,.3)}
.avatar img{width:100%;height:100%;object-fit:cover}
.u-info{flex:1;min-width:0}
.u-nm{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-sub{font-size:10px;color:#8e8e93;font-weight:700}
.icon-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);border:.5px solid rgba(255,255,255,.1);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .1s}
.icon-btn:active{transform:scale(.92)}
.wallet-chip{background:linear-gradient(135deg,#0088FF,#00D4FF);border-radius:14px;padding:8px 12px;color:#fff;font-weight:900;font-size:11px;cursor:pointer;border:none;font-family:inherit;display:flex;align-items:center;gap:6px;flex-shrink:0;transition:transform .1s;box-shadow:0 4px 12px rgba(0,136,255,.35)}
.wallet-chip:active{transform:scale(.95)}
.wallet-chip.connected{background:linear-gradient(135deg,#30D158,#00B84C);box-shadow:0 4px 12px rgba(48,209,88,.35)}
.wallet-chip .dot{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff}
.wallet-chip .dot.off{background:#FFD60A;box-shadow:0 0 6px #FFD60A;animation:blink 1.5s infinite}
@keyframes blink{50%{opacity:.3}}

/* BALANCE */
.bal-wrap{padding:22px 18px 12px;text-align:center;flex-shrink:0}
.bal-lbl{font-size:10px;color:#8e8e93;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.bal-val{font-size:46px;font-weight:900;letter-spacing:-2px;line-height:1;display:flex;align-items:baseline;justify-content:center;gap:6px}
.bal-val .num{background:linear-gradient(135deg,#FFE066,#FFD60A 40%,#FF9500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 2px 12px rgba(255,214,10,.4))}
.bal-val .cur{font-size:16px;color:#8e8e93;font-weight:800;-webkit-text-fill-color:#8e8e93}
.wallet-info{margin-top:10px;font-size:11px;color:#8e8e93;font-weight:700;font-family:monospace;direction:ltr}

/* COIN */
.coin-area{flex:1;display:flex;align-items:center;justify-content:center;position:relative;padding:10px;min-height:0}
.coin{width:240px;height:240px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#FFE066 0%,#FFD60A 35%,#FF9500 75%,#E67E00 100%);display:flex;align-items:center;justify-content:center;font-size:120px;cursor:pointer;position:relative;box-shadow:0 0 60px rgba(255,214,10,.5),0 0 120px rgba(255,149,0,.3),inset 0 -18px 36px rgba(180,90,0,.5),inset 0 18px 36px rgba(255,255,255,.5),0 20px 40px rgba(0,0,0,.3);transition:transform .06s ease;user-select:none;touch-action:manipulation;will-change:transform}
.coin::before{content:'';position:absolute;inset:14px;border-radius:50%;border:3px dashed rgba(255,255,255,.32);animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.coin:active{transform:scale(.93)}
.coin.pulse{animation:coinPulse .25s ease-out}
@keyframes coinPulse{50%{transform:scale(1.06)}}
.float{position:fixed;font-size:22px;font-weight:900;color:#FFD60A;pointer-events:none;text-shadow:0 0 12px rgba(255,214,10,.9);will-change:transform,opacity;z-index:9999}
.part{position:fixed;width:6px;height:6px;background:#FFD60A;border-radius:50%;pointer-events:none;z-index:9998;box-shadow:0 0 10px #FFD60A;will-change:transform,opacity}

/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.95);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-top:.5px solid rgba(255,255,255,.08);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px calc(12px + env(safe-area-inset-bottom));z-index:100}
.ni{display:flex;flex-direction:column;align-items:center;gap:3px;color:#636366;cursor:pointer;padding:6px 0;font-size:9px;font-weight:700;background:none;border:none;font-family:inherit;letter-spacing:.2px;transition:color .15s}
.ni.on{color:#FFD60A}
.ni .ic{font-size:22px;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.ni.on .ic{transform:translateY(-2px) scale(1.05)}

/* MARKET */
.mhead{padding:20px 18px 12px;flex-shrink:0}
.mtitle{font-size:26px;font-weight:900;letter-spacing:-.8px;margin-bottom:4px}
.msub{font-size:12px;color:#8e8e93;font-weight:700}
.mlist{padding:0 18px 130px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.gift{background:linear-gradient(135deg,#1c1c1e,#161618);border-radius:18px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;border:.5px solid rgba(255,255,255,.05)}
.gift-em{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;border:.5px solid rgba(255,255,255,.06)}
.gift-info{flex:1;min-width:0}
.gift-nm{font-size:14px;font-weight:800;margin-bottom:3px}
.gift-ds{font-size:11px;color:#8e8e93;font-weight:600}
.gift-price{font-size:15px;font-weight:900;color:#00D4FF;margin-top:5px;direction:ltr;text-align:right;text-shadow:0 0 12px rgba(0,212,255,.3)}
.gift-btn{background:linear-gradient(135deg,#00D4FF,#0088FF);border:none;border-radius:12px;padding:10px 14px;color:#fff;font-weight:900;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;box-shadow:0 4px 12px rgba(0,212,255,.35);transition:transform .1s}
.gift-btn:active{transform:scale(.95)}

/* PROFILE */
.pwrap{padding:20px 18px 130px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.phead{background:linear-gradient(135deg,#1c1c1e,#161618);border-radius:22px;padding:24px 20px;text-align:center;margin-bottom:14px;border:.5px solid rgba(255,255,255,.05)}
.av-big{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#FFD60A,#FF9500);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;margin:0 auto 12px;border:2px solid rgba(255,255,255,.15);overflow:hidden;color:#000;box-shadow:0 8px 24px rgba(255,214,10,.3)}
.av-big img{width:100%;height:100%;object-fit:cover}
.p-nm{font-size:20px;font-weight:900}
.p-us{font-size:12px;color:#8e8e93;font-weight:700;margin-top:3px;direction:ltr}
.p-card{background:#1c1c1e;border-radius:18px;padding:16px;margin-bottom:12px;border:.5px solid rgba(255,255,255,.05)}
.p-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:.5px solid rgba(255,255,255,.06);flex-direction:row-reverse}
.p-row:last-child{border-bottom:none}
.p-row .lbl{font-size:13px;color:#c7c7cc;font-weight:700}
.p-row .val{font-size:14px;font-weight:900;color:#fff;font-family:monospace;direction:ltr}

/* BUTTONS */
.wallet-big{background:linear-gradient(135deg,#0088FF,#00D4FF);border:none;border-radius:18px;padding:18px;color:#fff;font-weight:900;font-size:15px;cursor:pointer;font-family:inherit;width:100%;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 30px rgba(0,136,255,.35);letter-spacing:-.2px;transition:transform .12s}
.wallet-big:active{transform:scale(.97)}
.wallet-big.connected{background:linear-gradient(135deg,#30D158,#00B84C);box-shadow:0 10px 30px rgba(48,209,88,.35)}
.wallet-big .em{font-size:22px}

.buy-big{background:linear-gradient(135deg,#00D4FF,#0088FF);border:none;border-radius:18px;padding:18px;color:#fff;font-weight:900;font-size:15px;cursor:pointer;font-family:inherit;width:100%;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 30px rgba(0,212,255,.35);transition:transform .12s}
.buy-big:active{transform:scale(.97)}
.buy-big .em{font-size:22px}

.sell-big{background:linear-gradient(135deg,#30D158,#00B84C);border:none;border-radius:18px;padding:18px;color:#fff;font-weight:900;font-size:15px;cursor:pointer;font-family:inherit;width:100%;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 30px rgba(48,209,88,.35);transition:transform .12s}
.sell-big:active{transform:scale(.97)}
.sell-big .em{font-size:22px}

.sup-big{background:#1c1c1e;border:.5px solid rgba(255,255,255,.08);border-radius:18px;padding:18px;color:#fff;font-weight:900;font-size:14px;cursor:pointer;font-family:inherit;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s}
.sup-big:active{transform:scale(.98)}

.price-box{background:#1c1c1e;border-radius:18px;padding:18px;margin-top:16px;border:.5px solid rgba(255,255,255,.05)}
.price-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:.5px solid rgba(255,255,255,.06);font-size:13px;font-weight:700}
.price-row:last-child{border-bottom:none}
.price-row .ton{color:#00D4FF;font-weight:900;direction:ltr}
.price-row .pts{color:#FFD60A;font-weight:900;direction:ltr}

/* MODAL */
.modal{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.92);backdrop-filter:blur(30px);display:none;align-items:center;justify-content:center;flex-direction:column;padding:30px;text-align:center}
.modal.on{display:flex}
.modal-em{font-size:110px;margin-bottom:16px;animation:modalPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes modalPop{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1)}}
.modal-ti{font-size:24px;font-weight:900;margin-bottom:8px;letter-spacing:-.5px}
.modal-sub{font-size:13px;color:#8e8e93;font-weight:700;margin-bottom:24px;line-height:1.6;max-width:280px;white-space:pre-line}
.modal-btn{background:linear-gradient(135deg,#00D4FF,#0088FF);border:none;border-radius:16px;padding:14px 40px;color:#fff;font-weight:900;font-size:15px;cursor:pointer;font-family:inherit;box-shadow:0 10px 30px rgba(0,212,255,.4)}

/* TOAST */
.ts{position:fixed;top:100px;left:50%;transform:translate3d(-50%,-200px,0);background:rgba(28,28,30,.98);color:#fff;padding:13px 22px;border-radius:14px;font-weight:800;font-size:13px;z-index:10000;transition:transform .35s cubic-bezier(.68,-.55,.265,1.55);border:.5px solid rgba(255,255,255,.1);max-width:88%;text-align:center}
.ts.sh{transform:translate3d(-50%,0,0)}
</style>
</head>

<script>
'use strict';
// ═══════════════════════════════════════
//   CONFIG
// ═══════════════════════════════════════
var DEV = 'r2r_rr';
var PER_TAP = 0.01;
var RECEIVER_ADDRESS = 'UQD-fCzstgdlLEtLxwVG2jYZbDvvUupZYP6af6QZz1-LXwfl';
var MANIFEST_URL = 'https://xx9coin.vercel.app/tonconnect-manifest.json';

// ═══════════════════════════════════════
//   TELEGRAM
// ═══════════════════════════════════════
var tgUser = null;
try {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user){
    tgUser = tg.initDataUnsafe.user;
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor('#000000');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
  }
} catch(e){}
if (!tgUser) tgUser = { first_name:'Player', username:'player', id:0 };

// ═══════════════════════════════════════
//   DOM CACHE
// ═══════════════════════════════════════
var $uNm = document.getElementById('uNm');
var $uSub = document.getElementById('uSub');
var $pName = document.getElementById('pName');
var $pUser = document.getElementById('pUser');
var $uAv = document.getElementById('uAv');
var $pAv = document.getElementById('pAv');
var $balNum = document.getElementById('balNum');
var $pBal = document.getElementById('pBal');
var $pTaps = document.getElementById('pTaps');
var $pLevel = document.getElementById('pLevel');
var $pWallet = document.getElementById('pWallet');
var $coin = document.getElementById('coin');
var $ts = document.getElementById('ts');
var $market = document.getElementById('marketList');
var $walletChip = document.getElementById('walletChip');
var $walletChipTxt = document.getElementById('walletChipTxt');
var $walletInfo = document.getElementById('walletInfo');

$uNm.textContent = tgUser.first_name;
$pName.textContent = tgUser.first_name;
$pUser.textContent = '@' + (tgUser.username || 'player');
var ini = (tgUser.first_name||'P')[0].toUpperCase();
if (tgUser.photo_url) {
  $uAv.innerHTML = '<img src="'+tgUser.photo_url+'">';
  $pAv.innerHTML = '<img src="'+tgUser.photo_url+'">';
} else {
  $uAv.textContent = ini;
  $pAv.textContent = ini;
}

// ═══════════════════════════════════════
//   STATE
// ═══════════════════════════════════════
var st = {
  balance: parseFloat(localStorage.getItem('xx_bal') || '0'),
  taps: parseInt(localStorage.getItem('xx_taps') || '0'),
  wallet: localStorage.getItem('xx_wallet') || '',
  walletShort: localStorage.getItem('xx_wallet_short') || ''
};

var saveTimer = null;
function saveLater() {
  if (saveTimer) return;
  saveTimer = setTimeout(function() {
    localStorage.setItem('xx_bal', st.balance.toFixed(4));
    localStorage.setItem('xx_taps', st.taps);
    saveTimer = null;
  }, 800);
}

// ═══════════════════════════════════════
//   UI
// ═══════════════════════════════════════
var updPending = false;
var lastBal = '', lastTaps = '';
function upd() {
  if (updPending) return;
  updPending = true;
  requestAnimationFrame(function() {
    var balTxt = st.balance.toFixed(2);
    if (balTxt !== lastBal) {
      $balNum.textContent = balTxt;
      $pBal.textContent = balTxt + ' xx9';
      lastBal = balTxt;
    }
    var tapsTxt = st.taps.toLocaleString();
    if (tapsTxt !== lastTaps) {
      $pTaps.textContent = tapsTxt;
      lastTaps = tapsTxt;
    }
    $pLevel.textContent = ((st.taps / 100) | 0) + 1;
    saveLater();
    updPending = false;
  });
}

// ═══════════════════════════════════════
//   WALLET UI
// ═══════════════════════════════════════
function updateWalletUI() {
  if (st.wallet) {
    $walletChip.classList.add('connected');
    $walletChipTxt.textContent = st.walletShort;
    $walletChip.querySelector('.dot').classList.remove('off');
    $pWallet.textContent = st.walletShort;
    $pWallet.style.color = '#30D158';
    $walletInfo.textContent = st.wallet;
    var wb = document.getElementById('walletBig');
    var wt = document.getElementById('walletBigTxt');
    if (wb) wb.classList.add('connected');
    if (wt) wt.textContent = '✅ محفظتك مربوطة';
    var wp = document.getElementById('walletProf');
    var wpt = document.getElementById('walletProfTxt');
    if (wp) wp.classList.add('connected');
    if (wpt) wpt.textContent = '✅ ' + st.walletShort;
  } else {
    $walletChip.classList.remove('connected');
    $walletChipTxt.textContent = 'ربط';
    $walletChip.querySelector('.dot').classList.add('off');
    $pWallet.textContent = 'غير مربوطة';
    $pWallet.style.color = '#c7c7cc';
    $walletInfo.textContent = '';
    var wb2 = document.getElementById('walletBig');
    var wt2 = document.getElementById('walletBigTxt');
    if (wb2) wb2.classList.remove('connected');
    if (wt2) wt2.textContent = '🔗 اربط محفظتك أولاً';
    var wp2 = document.getElementById('walletProf');
    var wpt2 = document.getElementById('walletProfTxt');
    if (wp2) wp2.classList.remove('connected');
    if (wpt2) wpt2.textContent = '🔗 اربط محفظتك';
  }
}

// ═══════════════════════════════════════
//   TON CONNECT
// ═══════════════════════════════════════
var tonConnectUI = null;

function initTonConnect() {
  try {
    if (typeof TON_CONNECT_UI === 'undefined') {
      console.log('TON Connect not loaded yet');
      return;
    }
    tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: MANIFEST_URL,
      buttonRootId: null
    });

    tonConnectUI.onStatusChange(function(wallet) {
      if (wallet && wallet.account && wallet.account.address) {
        var addr = wallet.account.address;
        st.wallet = addr;
        st.walletShort = addr.slice(0, 4) + '...' + addr.slice(-4);
        localStorage.setItem('xx_wallet', addr);
        localStorage.setItem('xx_wallet_short', st.walletShort);
        updateWalletUI();
        tost('✅ تم ربط المحفظة!');
        if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
      } else {
        st.wallet = '';
        st.walletShort = '';
        localStorage.removeItem('xx_wallet');
        localStorage.removeItem('xx_wallet_short');
        updateWalletUI();
      }
    });

    // Restore previous connection
    if (tonConnectUI.connected) {
      var w = tonConnectUI.wallet;
      if (w && w.account && w.account.address) {
        var addr2 = w.account.address;
        st.wallet = addr2;
        st.walletShort = addr2.slice(0, 4) + '...' + addr2.slice(-4);
        localStorage.setItem('xx_wallet', addr2);
        localStorage.setItem('xx_wallet_short', st.walletShort);
      }
    }
  } catch(e) {
    console.log('TON Connect init error:', e);
  }
  updateWalletUI();
}

// Open wallet connection modal
function connectWallet() {
  if (!tonConnectUI) {
    // Try to init again
    initTonConnect();
    if (!tonConnectUI) {
      tost('⚠️ المحفظة تحتاج اتصال إنترنت');
      return;
    }
  }
  if (st.wallet) {
    // Already connected — show disconnect option
    document.getElementById('mEm').textContent = '🔗';
    document.getElementById('mTi').textContent = 'المحفظة مربوطة';
    document.getElementById('mSub').textContent = st.wallet + '\n\nهل تريد فصلها؟';
    document.getElementById('modal').classList.add('on');
    var btn = document.querySelector('.modal-btn');
    btn.textContent = 'فصل المحفظة';
    btn.onclick = function() {
      tonConnectUI.disconnect();
      closeModal();
      setTimeout(function(){
        var b = document.querySelector('.modal-btn');
        b.textContent = 'موافق';
        b.onclick = closeModal;
      }, 300);
    };
    return;
  }
  tonConnectUI.openModal();
}

// ═══════════════════════════════════════
//   BUY WITH TON
// ═══════════════════════════════════════
async function buyWithTON(amountTON, itemName) {
  if (!tonConnectUI || !st.wallet) {
    tost('🔗 اربط محفظتك أولاً');
    connectWallet();
    return;
  }
  try {
    var amountNano = Math.floor(amountTON * 1e9).toString();
    var tx = {
      validUntil: Math.floor(Date.now() / 1000) + 600,
      messages: [
        {
          address: RECEIVER_ADDRESS,
          amount: amountNano
        }
      ]
    };
    var result = await tonConnectUI.sendTransaction(tx);
    // Success
    document.getElementById('mEm').textContent = '✅';
    document.getElementById('mTi').textContent = 'تم الدفع بنجاح!';
    document.getElementById('mSub').textContent = 'المبلغ: ' + amountTON + ' TON\n\nراسل @r2r_rr لاستلام ' + itemName;
    document.getElementById('modal').classList.add('on');
    if (navigator.vibrate) navigator.vibrate([50, 100, 50]);
    // Open dev chat
    setTimeout(function(){
      openDev('✅ دفعت ' + amountTON + ' TON لـ ' + itemName + '\n📊 رصيدي: ' + getBalText() + '\n🔗 محفظتي: ' + st.wallet);
    }, 1800);
  } catch(e) {
    if (e && e.message && e.message.includes('cancel')) {
      tost('❌ ألغيت العملية');
    } else {
      tost('❌ فشلت العملية');
      console.log(e);
    }
  }
}

// ═══════════════════════════════════════
//   FLOAT / PARTICLES (pooled)
// ═══════════════════════════════════════
var floatPool = [], partPool = [];
function getFloat() {
  if (floatPool.length) return floatPool.pop();
  var f = document.createElement('div');
  f.className = 'float';
  return f;
}
function getPart() {
  if (partPool.length) return partPool.pop();
  var p = document.createElement('div');
  p.className = 'part';
  return p;
}

// ═══════════════════════════════════════
//   TAP
// ═══════════════════════════════════════
function tap(clientX, clientY) {
  st.balance += PER_TAP;
  st.taps++;
  $coin.classList.add('pulse');
  setTimeout(function(){ $coin.classList.remove('pulse'); }, 250);

  var x = clientX || window.innerWidth/2;
  var y = clientY || window.innerHeight/2;

  var f = getFloat();
  f.textContent = '+0.01';
  f.style.left = (x - 30) + 'px';
  f.style.top = (y - 20) + 'px';
  document.body.appendChild(f);
  var fx = f.animate([
    { transform: 'translate3d(0,0,0) scale(1)', opacity: 1 },
    { transform: 'translate3d(0,-120px,0) scale(1.3)', opacity: 0 }
  ], { duration: 900, easing: 'cubic-bezier(.22,.61,.36,1)', fill: 'forwards' });
  fx.onfinish = function() {
    f.remove();
    if (floatPool.length < 10) floatPool.push(f);
  };

  for (var i = 0; i < 3; i++) {
    var p = getPart();
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    document.body.appendChild(p);
    var a = Math.PI * 2 * i / 3;
    var d = 30 + Math.random() * 25;
    var px = Math.cos(a) * d, py = Math.sin(a) * d;
    var anim = p.animate([
      { transform: 'translate3d(0,0,0) scale(1)', opacity: 1 },
      { transform: 'translate3d(' + px + 'px,' + py + 'px,0) scale(0)', opacity: 0 }
    ], { duration: 550, easing: 'ease-out', fill: 'forwards' });
    anim.onfinish = (function(el){
      return function() {
        el.remove();
        if (partPool.length < 20) partPool.push(el);
      };
    })(p);
  }

  if (navigator.vibrate) navigator.vibrate(3);
  upd();
}

var lastTapTime = 0;
function handleTap(e) {
  e.preventDefault();
  var now = performance.now();
  if (now - lastTapTime < 30) return;
  lastTapTime = now;
  var t = e.touches ? e.touches[0] : e;
  tap(t.clientX, t.clientY);
}
$coin.addEventListener('touchstart', handleTap, {passive:false});
$coin.addEventListener('mousedown', handleTap);

// ═══════════════════════════════════════
//   NAV
// ═══════════════════════════════════════
var screens = {
  home: document.getElementById('scrHome'),
  market: document.getElementById('scrMarket'),
  trade: document.getElementById('scrTrade'),
  profile: document.getElementById('scrProfile')
};
var navBtns = document.querySelectorAll('.ni');

function go(h) {
  for (var k in screens) screens[k].classList.remove('on');
  screens[h].classList.add('on');
  for (var i = 0; i < navBtns.length; i++) {
    navBtns[i].classList.toggle('on', navBtns[i].dataset.h === h);
  }
  if (h === 'market' && !marketRendered) renderMarket();
  updateWalletUI();
  if (navigator.vibrate) navigator.vibrate(5);
}
for (var n = 0; n < navBtns.length; n++) {
  (function(btn){
    btn.addEventListener('click', function(){ go(btn.dataset.h); });
  })(navBtns[n]);
}

// ═══════════════════════════════════════
//   MARKET
// ═══════════════════════════════════════
var GIFTS = [
  { em:'🌹', name:'وردة',      desc:'هدية رومانسية', ton: 0.1 },
  { em:'❤️', name:'قلب أحمر', desc:'عبّر عن حبك',    ton: 0.5 },
  { em:'🎂', name:'كيكة',      desc:'احتفل بيوم ميلاد', ton: 1 },
  { em:'⭐', name:'نجمة',     desc:'أرسلها لصديق',   ton: 2 },
  { em:'🚀', name:'صاروخ',    desc:'للمتفوقين',      ton: 5 },
  { em:'👑', name:'تاج',       desc:'للملوك فقط',     ton: 10 },
  { em:'💎', name:'ألماسة',   desc:'هدية فاخرة',     ton: 25 },
  { em:'🏆', name:'كأس',      desc:'للأبطال',        ton: 50 },
  { em:'🎁', name:'صندوق',    desc:'محتوى مفاجئ',    ton: 100 },
  { em:'🧸', name:'دبدوب',    desc:'هدية لطيفة',     ton: 250 }
];
var marketRendered = false;

function renderMarket() {
  var frag = document.createDocumentFragment();
  for (var i = 0; i < GIFTS.length; i++) {
    var g = GIFTS[i];
    var div = document.createElement('div');
    div.className = 'gift';
    div.innerHTML =
      '<div class="gift-em">' + g.em + '</div>' +
      '<div class="gift-info">' +
        '<div class="gift-nm">' + g.name + '</div>' +
        '<div class="gift-ds">' + g.desc + '</div>' +
        '<div class="gift-price">' + g.ton + ' TON</div>' +
      '</div>' +
      '<button class="gift-btn">شراء</button>';
    var btn = div.querySelector('.gift-btn');
    (function(gift){
      btn.addEventListener('click', function(){ buyGift(gift); });
    })(g);
    frag.appendChild(div);
  }
  $market.innerHTML = '';
  $market.appendChild(frag);
  marketRendered = true;
}

function buyGift(g) {
  if (!st.wallet) {
    tost('🔗 اربط محفظتك أولاً');
    connectWallet();
    return;
  }
  // Confirm modal
  document.getElementById('mEm').textContent = g.em;
  document.getElementById('mTi').textContent = g.name + ' — ' + g.ton + ' TON';
  document.getElementById('mSub').textContent = 'سيتم فتح محفظتك للدفع';
  document.getElementById('modal').classList.add('on');
  if (navigator.vibrate) navigator.vibrate([15, 30, 15]);
  setTimeout(function(){
    closeModal();
    buyWithTON(g.ton, g.em + ' ' + g.name);
  }, 1000);
}

function closeModal() {
  document.getElementById('modal').classList.remove('on');
}

// ═══════════════════════════════════════
//   UTILS
// ═══════════════════════════════════════
function getBalText() {
  return st.balance.toFixed(2) + ' xx9';
}

function openDev(msg) {
  var text = msg || 'مرحباً';
  var tgUrl = 'https://t.me/' + DEV;
  try {
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
      if (navigator.clipboard) navigator.clipboard.writeText(text);
      window.Telegram.WebApp.openTelegramLink(tgUrl);
    } else {
      window.location.href = tgUrl + '?text=' + encodeURIComponent(text);
    }
  } catch(e) {
    window.location.href = tgUrl;
  }
}

function tost(m) {
  $ts.textContent = m;
  $ts.classList.add('sh');
  clearTimeout(tost._t);
  tost._t = setTimeout(function(){ $ts.classList.remove('sh'); }, 2200);
}

// ═══════════════════════════════════════
//   INIT
// ═══════════════════════════════════════
upd();
updateWalletUI();

// Init TON Connect after page load
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function(){
    setTimeout(initTonConnect, 500);
  });
} else {
  setTimeout(initTonConnect, 500);
}

// Prevent double-tap zoom
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
