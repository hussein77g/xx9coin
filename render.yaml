services:
  - type: web
    name: xx9coin-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        value: 6432606301
      - key: CHANNEL_ID
        value: -1004448656917
      - key: PYTHON_VERSION
        value: 3.11.0
